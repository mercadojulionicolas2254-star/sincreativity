<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <link rel="stylesheet" href="css.css">

  <style>
    .principal2 {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      padding: 30px;
    }

    .contactobanner {
      max-width: 100%;
      height: auto;
    }

    .menumenu2 {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .menubutton2 {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    #contenedor2 {
      width: 100%;
      text-align: center;
    }

    #contenedor2 img {
      display: none;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      .principal2 {
        padding: 20px;
      }
    }
  </style>
</head>

<body class="contacto">

  <nav class="menu">
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="nosotros.html">Nosotros</a></li>
      <li><a href="evidencias.html">Evidencias</a></li>
      <li><a href="fdst.html">Solución tecnológica</a></li>
      <li><a href="proyecto.html">Proyecto</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>

  <main class="principal2">

    <img
      class="contactobanner"
      src="bnnrctc.png"
      alt="Banner de contacto">

    <div class="menumenu2">
      <button
        class="menubutton2"
        type="button"
        onclick="mostrarImagen(1)">
        Nicolas Mercado
      </button>

      <button
        class="menubutton2"
        type="button"
        onclick="mostrarImagen(2)">
        Francisco Mendoza
      </button>
    </div>

    <div id="contenedor2">

      <img
        id="img1"
        class="cv"
        src="cvni.png"
        alt="Hoja de vida de Nicolas Mercado">

      <img
        id="img2"
        class="cv"
        src="cvn.jpg"
        alt="Hoja de vida de Francisco Mendoza">

    </div>

  </main>

  <script>
    function mostrarImagen(numero) {
      const imagenes = document.querySelectorAll("#contenedor2 img");

      imagenes.forEach(function(imagen) {
        imagen.style.display = "none";
      });

      const imagenSeleccionada = document.getElementById("img" + numero);

      if (imagenSeleccionada) {
        imagenSeleccionada.style.display = "block";

        imagenSeleccionada.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    }
  </script>

</body>
</html>
