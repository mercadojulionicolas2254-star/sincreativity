<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosotros</title>

  <link rel="stylesheet" href="css.css">

  <style>
    .principal {
      display: flex;
      align-items: flex-start;
      gap: 40px;
      padding: 30px;
    }

    .menumenu {
      display: flex;
      flex-direction: column;
      width: 220px;
      flex-shrink: 0;
      gap: 15px;
    }

    .menubutton {
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    #contenedor {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    #contenedor img {
      display: none;
      width: 900px;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      .principal {
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }

      .menumenu {
        width: 100%;
        max-width: 320px;
      }

      #contenedor {
        width: 100%;
      }
    }
  </style>
</head>

<body style="background-color: #D2AFFA;">

  <nav class="menu">
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="nosotros.html">Nosotros</a></li>
      <li><a href="evidencias.html">Evidencias</a></li>
      <li><a href="fdst.html">Solución tecnológica</a></li>
      <li><a href="proyecto.html">Proyecto</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>

  <!-- Logo -->
  <img class="logo" src="logo.png" alt="Logo">

  <!-- Botones e imágenes -->
  <main class="principal">

    <div class="menumenu">
      <button class="menubutton" type="button"
        onclick="mostrarImagen(1)">Misión</button>

      <button class="menubutton" type="button"
        onclick="mostrarImagen(2)">Visión</button>

      <button class="menubutton" type="button"
        onclick="mostrarImagen(3)">Objetivo general</button>

      <button class="menubutton" type="button"
        onclick="mostrarImagen(4)">Objetivo específico</button>

      <button class="menubutton" type="button"
        onclick="mostrarImagen(5)">Cronograma</button>

      <button class="menubutton" type="button"
        onclick="mostrarImagen(6)">Pregunta P.</button>
    </div>

    <div id="contenedor">
      <img id="img1" src="mision.jpg" alt="Misión">

      <img id="img2" src="vision.jpg" alt="Visión">

      <img id="img3" src="objetivo general.jpg"
        alt="Objetivo general">

      <img id="img4" src="objetivo especifico.jpg"
        alt="Objetivo específico">

      <img id="img5" class="crono" src="crng.png"
        alt="Cronograma">

      <img id="img6" src="pp.png"
        alt="Pregunta del proyecto">
    </div>

  </main>

  <!-- Banner inferior -->
  <img class="nosotrosbanner"
    src="bnnrnstrs.png" alt="Banner de Nosotros">

  <!-- Función para mostrar las imágenes -->
  <script>
    function mostrarImagen(numero) {
      const imagenes =
        document.querySelectorAll("#contenedor img");

      imagenes.forEach(function(imagen) {
        imagen.style.display = "none";
      });

      const imagenSeleccionada =
        document.getElementById("img" + numero);

      if (imagenSeleccionada) {
        imagenSeleccionada.style.display = "block";

        imagenSeleccionada.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    }
  </script>

</body>
</html>
